<style>
    :root{
        --mobile-accent:#0da34e;
        --mobile-accent-dark:#08783a;
        --mobile-bg:#f3f5f4;
        --mobile-surface:#ffffff;
        --mobile-text:#101712;
        --mobile-muted:#6b746e;
        --mobile-line:#e7ebe8;
        --mobile-radius:20px;
        --mobile-shadow:0 8px 28px rgba(23,38,29,.07);
    }

    html{
        min-height:100%;
        background:#e9eeeb;
        -webkit-text-size-adjust:100%;
    }

    body{
        min-height:100%;
        background:var(--mobile-bg);
        color:var(--mobile-text);
        font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        font-size:14px;
        line-height:1.45;
        -webkit-font-smoothing:antialiased;
    }

    button,
    input,
    select,
    textarea{
        font:inherit;
    }

    a,
    button{
        -webkit-tap-highlight-color:transparent;
    }

    .app{
        width:100%;
        max-width:480px;
        min-height:100dvh;
        padding-bottom:calc(94px + env(safe-area-inset-bottom));
        background:var(--mobile-bg);
        box-shadow:0 0 45px rgba(16,24,18,.08);
    }

    .content{
        padding:20px 18px 24px;
    }

    .bottom-nav{
        width:calc(100% - 20px);
        max-width:460px;
        height:72px;
        bottom:calc(10px + env(safe-area-inset-bottom));
        padding:7px 8px;
        justify-content:space-between;
        background:rgba(255,255,255,.96);
        border:1px solid rgba(218,225,220,.9);
        border-radius:22px;
        box-shadow:0 12px 34px rgba(25,42,31,.14);
        backdrop-filter:blur(16px);
    }

    .nav-item{
        height:56px;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:3px;
        color:#7d857f;
        border-radius:16px;
        font-size:10px;
        font-weight:600;
        line-height:1;
        transition:background-color .2s ease,color .2s ease,transform .2s ease;
    }

    .nav-item:active{
        transform:scale(.96);
    }

    .nav-item.active{
        color:var(--mobile-accent-dark);
        background:#edf8f1;
        font-weight:800;
    }

    .nav-icon-img,
    .nav-icon-wrap{
        width:30px;
        height:30px;
        margin:0;
    }

    .nav-icon-wrap{
        margin:0 auto;
    }

    .order-center{
        margin-top:0;
    }

    .order-circle{
        width:38px;
        height:38px;
        margin:-4px auto -1px;
        background:#e8ece9;
        border:0;
    }

    .nav-item.active .order-circle{
        background:#dff4e7;
    }

    .order-circle img{
        width:34px;
        height:34px;
    }

    .message-count-badge{
        top:-7px;
        right:-8px;
        min-width:18px;
        height:18px;
        padding:0 4px;
        font-size:9px;
    }

    /* Home */
    .page-user_home .content{
        padding-top:12px;
    }

    .page-user_home .logo-area{
        height:56px;
        border-radius:18px 18px 0 0;
    }

    .page-user_home .logo-text{
        font-size:23px;
        letter-spacing:-.7px;
    }

    .page-user_home .marquee-bar{
        height:32px;
        border-radius:0 0 18px 18px;
        background:#151a17;
        font-size:11px;
    }

    .page-user_home .hero-media{
        height:190px;
        margin:16px 0;
        border-radius:22px;
        box-shadow:var(--mobile-shadow);
    }

    .page-user_home .menu-grid{
        gap:10px;
        margin-bottom:20px;
    }

    .page-user_home .menu-item{
        min-height:88px;
        padding:10px 4px 8px;
        display:flex;
        align-items:center;
        justify-content:center;
        color:#252c27;
        background:var(--mobile-surface);
        border:1px solid var(--mobile-line);
        border-radius:17px;
        font-size:10.5px;
        font-weight:650;
        box-shadow:0 4px 14px rgba(23,38,29,.035);
    }

    .page-user_home .menu-icon{
        width:44px;
        height:44px;
        margin:0 auto 6px;
        padding:4px;
        background:#f0f7f3;
        border-radius:14px;
    }

    .page-user_home .menu-icon img{
        width:36px;
        height:36px;
    }

    .page-user_home .stats-grid{
        gap:10px;
    }

    .page-user_home .stats-card{
        border:1px solid var(--mobile-line);
        border-radius:18px;
        box-shadow:0 5px 18px rgba(23,38,29,.045);
    }

    .page-user_home .vip-title{
        margin-top:22px;
        font-size:18px;
    }

    .page-user_home .vip-card{
        height:70px;
        border-radius:20px;
        background:linear-gradient(135deg,#0da34e,#08783a);
        box-shadow:0 10px 24px rgba(13,163,78,.18);
    }

    /* Records */
    .page-user_records .content{
        padding:0 0 24px;
    }

    .page-user_records .tabs{
        gap:8px;
        padding:16px 18px 12px;
        background:rgba(243,245,244,.94);
        backdrop-filter:blur(12px);
    }

    .page-user_records .tab-btn{
        height:40px;
        color:var(--mobile-muted);
        border:1px solid var(--mobile-line);
        border-radius:13px;
        font-size:12px;
        font-weight:700;
    }

    .page-user_records .tab-btn.active{
        color:#fff;
        background:var(--mobile-accent);
        border-color:var(--mobile-accent);
        box-shadow:0 6px 16px rgba(13,163,78,.18);
    }

    .page-user_records .records-list{
        padding:0 18px 18px;
    }

    .page-user_records .record-time{
        margin:12px 2px 8px;
        color:var(--mobile-muted);
        font-size:11px;
        font-weight:650;
    }

    .page-user_records .record-card{
        margin-bottom:14px;
        padding:18px 14px 16px;
        border:1px solid var(--mobile-line);
        border-radius:20px;
        box-shadow:var(--mobile-shadow);
    }

    .page-user_records .status{
        top:14px;
        right:14px;
        padding:5px 9px;
        color:var(--mobile-accent-dark);
        background:#e8f7ee;
        border-radius:999px;
        font-size:10px;
    }

    .page-user_records .product-info{
        padding-right:72px;
    }

    .page-user_records .product-title{
        font-size:14px;
        line-height:1.35;
    }

    .page-user_records .submit-btn{
        min-height:36px;
        background:var(--mobile-accent);
        border-radius:11px;
    }

    /* Order */
    .page-user_order .profile-row,
    .page-user_settings .profile-row{
        padding:14px;
        background:var(--mobile-surface);
        border:1px solid var(--mobile-line);
        border-radius:20px;
        box-shadow:0 5px 18px rgba(23,38,29,.045);
    }

    .page-user_order .avatar,
    .page-user_settings .avatar{
        width:56px;
        height:56px;
        box-shadow:none;
        border:2px solid #e4f3e9;
    }

    .page-user_order .wallet-card,
    .page-user_settings .wallet-card{
        padding:20px;
        border-radius:22px;
        box-shadow:0 12px 28px rgba(13,163,78,.2);
    }

    .page-user_order .info-btn{
        min-height:62px;
        height:auto;
        border:1px solid var(--mobile-line);
        border-radius:16px;
        box-shadow:none;
    }

    .page-user_order .animation-box{
        border-radius:22px;
        box-shadow:var(--mobile-shadow);
    }

    .page-user_order .start-btn,
    .page-user_order .continue-btn{
        height:52px;
        border-radius:16px;
        box-shadow:0 9px 20px rgba(13,163,78,.2);
    }

    .page-user_order .history-card{
        padding:14px;
        border:1px solid var(--mobile-line);
        border-radius:16px;
        box-shadow:none;
    }

    /* Messages */
    .page-user_messages .messages-heading{
        margin:2px 0 18px;
        font-size:24px;
        letter-spacing:-.5px;
    }

    .page-user_messages .service-card{
        margin:0;
        padding:15px;
        border:1px solid var(--mobile-line);
        border-radius:20px;
        box-shadow:var(--mobile-shadow);
    }

    .page-user_messages .service-icon{
        width:50px;
        height:50px;
        flex-basis:50px;
        border-radius:16px;
    }

    .page-user_messages .notification-heading{
        margin:26px 2px 12px;
    }

    .page-user_messages .notification-list{
        margin:0;
        padding:0 14px;
        overflow:hidden;
        border:1px solid var(--mobile-line);
        border-radius:20px;
        box-shadow:var(--mobile-shadow);
    }

    .page-user_messages .notification-item{
        margin:0;
        padding:15px 0;
        border-bottom:1px solid var(--mobile-line);
    }

    .page-user_messages .notification-item:last-of-type{
        border-bottom:0;
    }

    .page-user_messages .notification-status{
        background:#182019;
        border-radius:999px;
    }

    /* Settings */
    .page-user_settings .section-title{
        margin:24px 2px 12px;
        font-size:17px;
        letter-spacing:-.2px;
    }

    .page-user_settings .menu-grid{
        gap:9px;
    }

    .page-user_settings .menu-card{
        height:92px;
        border:1px solid var(--mobile-line);
        border-radius:17px;
        box-shadow:none;
        font-size:11px;
    }

    .page-user_settings .menu-icon{
        width:42px;
        height:42px;
        border-radius:14px;
    }

    .page-user_settings .menu-icon img{
        width:34px;
        height:34px;
    }

    .page-user_settings .vip-card{
        height:72px;
        border-radius:20px;
        box-shadow:0 9px 22px rgba(13,163,78,.18);
    }

    .page-user_settings .other-box{
        border:1px solid var(--mobile-line);
        border-radius:20px;
        box-shadow:var(--mobile-shadow);
    }

    .page-user_settings .other-row{
        height:62px;
        border-color:var(--mobile-line);
        font-size:14px;
    }

    .page-user_settings .logout-btn{
        height:52px;
        border-radius:16px;
        box-shadow:0 9px 20px rgba(13,163,78,.18);
    }

    @media (max-width:360px){
        .content{
            padding-right:14px;
            padding-left:14px;
        }

        .page-user_home .menu-grid,
        .page-user_settings .menu-grid{
            gap:7px;
        }

        .page-user_home .menu-item{
            padding-right:2px;
            padding-left:2px;
            font-size:9.5px;
        }

        .page-user_messages .service-title{
            font-size:13px;
        }

        .page-user_messages .online-badge{
            display:none;
        }
    }

    @media (min-width:600px){
        body{
            padding:20px 0;
        }

        .app{
            min-height:calc(100dvh - 40px);
            border-radius:28px;
            overflow:hidden;
        }
    }
</style>
