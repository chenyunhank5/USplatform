<style>
    .page-loading-overlay{
        position:fixed;
        inset:0;
        z-index:100000;
        display:flex;
        align-items:center;
        justify-content:center;
        background:transparent;
        opacity:0;
        visibility:hidden;
        pointer-events:none;
        transition:opacity .15s ease, visibility .15s ease;
    }

    .page-loading-overlay.is-active{
        opacity:1;
        visibility:visible;
    }

    .page-loading-spinner{
        width:44px;
        height:44px;
        border:4px solid #d1d5db;
        border-top-color:#6b7280;
        border-radius:50%;
        animation:page-loading-spin .7s linear infinite;
    }

    @keyframes page-loading-spin{
        to{transform:rotate(360deg)}
    }

    @media (prefers-reduced-motion:reduce){
        .page-loading-overlay{transition:none}
        .page-loading-spinner{animation-duration:1.4s}
    }
</style>

<div id="pageLoadingOverlay"
     class="page-loading-overlay"
     role="status"
     aria-label="Loading page"
     aria-hidden="true">
    <span class="page-loading-spinner" aria-hidden="true"></span>
</div>

<script>
(() => {
    const overlay = document.getElementById('pageLoadingOverlay');

    if (!overlay) {
        return;
    }

    const showLoader = () => {
        overlay.classList.add('is-active');
        overlay.setAttribute('aria-hidden', 'false');
    };

    const hideLoader = () => {
        overlay.classList.remove('is-active');
        overlay.setAttribute('aria-hidden', 'true');
    };

    window.addEventListener('pageshow', hideLoader);
    window.addEventListener('load', hideLoader);
    document.addEventListener('DOMContentLoaded', hideLoader);
    window.setTimeout(hideLoader, 1500);
    window.addEventListener('beforeunload', showLoader);

    document.addEventListener('click', (event) => {
        const link = event.target.closest('a[href]');

        if (!link || event.defaultPrevented || event.button !== 0 ||
            event.metaKey || event.ctrlKey || event.shiftKey || event.altKey ||
            link.target === '_blank' || link.hasAttribute('download') ||
            link.dataset.noPageLoader !== undefined) {
            return;
        }

        const destination = new URL(link.href, window.location.href);
        const isSameDocument = destination.pathname === window.location.pathname &&
            destination.search === window.location.search && destination.hash;

        if (destination.origin === window.location.origin && !isSameDocument) {
            showLoader();
        }
    });

    document.addEventListener('submit', (event) => {
        if (!event.defaultPrevented && event.target.dataset.noPageLoader === undefined) {
            showLoader();
        }
    });
})();
</script>
