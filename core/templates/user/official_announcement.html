<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; background: #fff; font-family: Arial, sans-serif; }
        .notice-page { width: 100%; max-width: 430px; min-height: 100vh; margin: 0 auto; background: #fff; }
        .notice-header { height: 58px; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; color: #fff; background: #000; border-bottom: 2px solid #d1d5db; font-size: 20px; font-weight: 700; }
        .notice-back { position: absolute; left: 16px; top: 50%; width: 36px; height: 42px; display: flex; align-items: center; color: #fff; text-decoration: none; transform: translateY(-50%); }
        .notice-back::before { width: 14px; height: 14px; content: ""; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(45deg); }
        .notice-empty { padding-top: 22px; color: #9ca3af; font-size: 18px; text-align: center; }
    </style>
</head>
<body>
    <main class="notice-page">
        <header class="notice-header">
            <a href="{% url 'user_settings' %}" class="notice-back" aria-label="Back to settings"></a>
            Notice
        </header>
        <div class="notice-empty">No More Data...</div>
    </main>
</body>
</html>
