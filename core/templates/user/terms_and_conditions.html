<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms and Conditions | Landor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, sans-serif;
            color: #111;
            background: #f3f4f6;
        }

        .terms-page {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            margin: 0 auto;
            background: #fff;
        }

        .terms-header {
            position: sticky;
            top: 0;
            z-index: 10;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: #000;
            border-bottom: 2px solid #d1d5db;
        }

        .back-link {
            position: absolute;
            left: 20px;
            top: 50%;
            width: 32px;
            height: 40px;
            display: flex;
            align-items: center;
            color: #fff;
            text-decoration: none;
            transform: translateY(-50%);
        }

        .back-arrow {
            width: 12px;
            height: 12px;
            border-left: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: rotate(45deg);
        }

        .terms-title {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }

        .terms-content {
            padding: 30px 28px 48px;
            font-size: 17px;
            line-height: 1.68;
            overflow-wrap: anywhere;
        }

        .terms-content h1,
        .terms-content h2,
        .terms-content h3 {
            margin: 18px 0 8px;
            line-height: 1.3;
        }

        .terms-content h1:first-child,
        .terms-content h2:first-child,
        .terms-content h3:first-child {
            margin-top: 0;
        }

        .terms-content h1 {
            font-size: 22px;
        }

        .terms-content h2 {
            font-size: 18px;
            font-weight: 400;
        }

        .terms-content h3 {
            font-size: 17px;
        }

        .terms-content p {
            margin: 0 0 8px;
        }

        .terms-content ul,
        .terms-content ol {
            margin: 8px 0 14px;
            padding-left: 24px;
        }

        .terms-content a {
            color: #2f3cff;
        }
    </style>
</head>

<body>
    <div class="terms-page">
        <header class="terms-header">
            <a
                href="{% url 'user_login' %}"
                class="back-link"
                aria-label="Back to login"
            >
                <span class="back-arrow"></span>
            </a>

            <h1 class="terms-title">Terms and Conditions</h1>
        </header>

        <main class="terms-content">
            {{ home_settings.terms_and_conditions_html|safe }}
        </main>
    </div>
</body>
</html>
