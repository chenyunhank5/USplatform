<div id="editLuckyRewardModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;">
    <div style="width:420px;max-width:calc(100% - 30px);margin:10vh auto;background:#1b1b1b;border:1px solid #444;padding:22px;color:#fff;">
        <h3 style="margin-top:0;">Edit Lucky Reward</h3>
        <form method="POST" id="editLuckyRewardForm">
            {% csrf_token %}
            <label>Target order number</label>
            <input type="number" name="target_order_number" id="editRewardTarget" min="1" required style="display:block;width:100%;margin:6px 0 14px;padding:8px;">
            <label>Payout amount</label>
            <input type="number" name="payout_amount" id="editRewardPayout" min="0" step="0.01" required style="display:block;width:100%;margin:6px 0 14px;padding:8px;">
            <label>Payout jump time (seconds)</label>
            <input type="number" name="payout_jump_time" id="editRewardJump" min="1" required style="display:block;width:100%;margin:6px 0 14px;padding:8px;">
            <label>Freeze reward</label>
            <select name="freeze_reward" id="editRewardFreeze" style="display:block;width:100%;margin:6px 0 18px;padding:8px;">
                <option value="no">No</option>
                <option value="yes">Yes</option>
            </select>
            <button type="submit" class="edit-btn">Save changes</button>
            <button type="button" class="delete-btn" onclick="closeEditLuckyRewardModal()">Cancel</button>
        </form>
    </div>
</div>

<script>
function openEditLuckyRewardModal(id, target, payout, jump, freeze){
    document.getElementById('editLuckyRewardForm').action = '/staff/edit-lucky-reward/' + id + '/';
    document.getElementById('editRewardTarget').value = target;
    document.getElementById('editRewardPayout').value = payout;
    document.getElementById('editRewardJump').value = jump;
    document.getElementById('editRewardFreeze').value = freeze ? 'yes' : 'no';
    document.getElementById('editLuckyRewardModal').style.display = 'block';
}

function closeEditLuckyRewardModal(){
    document.getElementById('editLuckyRewardModal').style.display = 'none';
}
</script>
