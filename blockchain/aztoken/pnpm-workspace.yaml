packages:
  - .

allowBuilds:
  # These are optional native accelerators. Ethers uses its JavaScript
  # implementations when their install scripts are intentionally denied.
  keccak: false
  secp256k1: false

# Hardhat 2 still permits older transitive versions. Force currently patched
# releases and keep the full contract suite as the compatibility check.
overrides:
  adm-zip: 0.6.0
  lodash: 4.18.1
  serialize-javascript: 7.1.0
  tmp: 0.2.7
  undici: 6.28.0
